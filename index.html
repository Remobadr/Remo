<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گود</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d1d1f;--mut:#6b6b70;--ac:#0f766e;--bd:#e4e1d8;--star:#b45309;--starbg:#fef3c7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--card:#1a1d20;--tx:#f0f0f0;--mut:#9aa0a6;--ac:#2dd4bf;--bd:#2b2f33;--star:#fbbf24;--starbg:#3a2e0b}}
:root[data-theme="dark"]{--bg:#101214;--card:#1a1d20;--tx:#f0f0f0;--mut:#9aa0a6;--ac:#2dd4bf;--bd:#2b2f33;--star:#fbbf24;--starbg:#3a2e0b}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;max-width:760px;margin:auto}
.logo{font-size:28px;font-weight:700;color:var(--ac)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 12px;font-size:14px}
.box b{color:var(--ac)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:auto;padding:0 16px 24px}
input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:8px 0}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.panel h3{margin:0 0 4px}.panel p{margin:0 0 6px;color:var(--mut);font-size:14px}
.key{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.key.star{background:var(--starbg);border-color:var(--star)}
.key code{direction:ltr;flex:1;min-width:140px;font-size:16px;font-family:ui-monospace,Menlo,monospace}
.key .st{color:var(--star);font-size:20px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.ad{min-height:90px;margin:12px 0;text-align:center}
.foot{max-width:760px;margin:auto;padding:16px;text-align:center;border-top:1px solid var(--bd)}
.foot a{display:inline-flex;gap:6px;margin:4px;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-decoration:none}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}.modal>div{background:var(--card);border-radius:14px;padding:18px;max-width:340px;width:100%;text-align:center}
.ic{width:20px;height:20px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grid a,.grid button{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);text-decoration:none;font:inherit;cursor:pointer}
.foot a{align-items:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:999px;display:none;z-index:30}
</style>
</head>
<body>
<div class="top">
  <div class="logo">گود</div>
  <div class="box">👁 الزوار: <b id="vc">…</b></div>
  <button id="th">🌓</button>
</div>
<main>
  <div class="panel">
    <h3>🔄 تبادل الأكواد</h3>
    <p>حط كود عندك (شغّال) واحصل على كود من زائر تاني.</p>
    <input id="mine" placeholder="كودك هنا" dir="ltr" maxlength="64">
    <button class="p" id="swap">تبادل</button>
    <div id="got"></div>
  </div>

  <!-- مكان الإعلان: الصقي هنا كود الإعلان من شبكة الإعلانات (مثل AdSense) -->
  <div class="ad" id="ad1"></div>

  <input id="q" placeholder="ابحث عن كود…" dir="ltr">
  <div id="list"></div>
  <div style="text-align:center"><button id="more">عرض المزيد</button></div>
</main>
<div class="foot">
  <div>تابعنا</div>
  <a data-ic="instagram" href="https://www.instagram.com/remoo.1311?exln=MWFjajdxNGIwZW9jZw==" target="_blank" rel="noopener"><span>إنستجرام</span></a>
  <a data-ic="tiktok" href="https://tiktok.com/@remoo1113" target="_blank" rel="noopener"><span>تيك توك</span></a>
</div>
<div class="modal" id="m"><div id="mc"></div></div>
<div class="toast" id="t"></div>
<script>
const SB="https://vqfauwlyrgvawajxooaf.supabase.co",KEY="sb_publishable_JFCTeEO7nqotiKv5680hYw_NgLjXWV0";
async function rpc(fn,args){
  const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  if(!r.ok)throw new Error(await r.text());return r.json();
}
const $=s=>document.querySelector(s);
const toast=m=>{const t=$("#t");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)};
async function copy(s){try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}toast("تم النسخ ✓")}
const pageUrl=()=>location.href.split("#")[0];
// أيقونات المنصات الأصلية (Simple Icons)
const P={

};
const ico=n=>`<svg class="ic" viewBox="0 0 24 24" fill="${P[n][0]}" aria-hidden="true"><path d="${P[n][1]}"/></svg>`;
document.querySelectorAll("[data-ic]").forEach(a=>a.insertAdjacentHTML("afterbegin",ico(a.dataset.ic)));

async function share(code){
  if(navigator.share){try{await navigator.share({title:"گود",text:"كود نسك: "+code,url:pageUrl()});return}catch(e){}}
  const txt=encodeURIComponent("كود نسك: "+code+" — من موقع گود"),u=encodeURIComponent(pageUrl());
  const L=[["whatsapp","واتساب","https://wa.me/?text="+txt+"%20"+u],["facebook","فيسبوك","https://www.facebook.com/sharer/sharer.php?u="+u],["x","تويتر (X)","https://twitter.com/intent/tweet?text="+txt+"&url="+u],["telegram","تليجرام","https://t.me/share/url?url="+u+"&text="+txt]];
  const links=L.map(l=>`<a href="${l[2]}" target="_blank" rel="noopener">${ico(l[0])}<span>${l[1]}</span></a>`).join("");
  const apps=`<button data-open="https://www.instagram.com/">${ico("instagram")}<span>إنستجرام</span></button><button data-open="https://www.tiktok.com/">${ico("tiktok")}<span>تيك توك</span></button>`;
  $("#mc").innerHTML=`<h3>مشاركة الكود</h3><div class="grid">${links}${apps}</div><p style="color:var(--mut);font-size:13px">إنستجرام وتيك توك: بننسخ الكود وتفتح التطبيق وتلصقيه.</p><button class="p" id="mx">إغلاق</button>`;
  $("#mc").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{copy(code);window.open(b.dataset.open,"_blank","noopener")});
  $("#m").classList.add("on");$("#mx").onclick=()=>$("#m").classList.remove("on");
}
$("#m").onclick=e=>{if(e.target.id==="m")$("#m").classList.remove("on")};
function keyRow(o){
  const d=document.createElement("div");d.className="key"+(o.featured?" star":"");
  d.innerHTML=(o.featured?'<span class="st">★</span>':"")+'<code></code><div class="row"><button class="p">نسخ</button><button>مشاركة</button></div>';
  d.querySelector("code").textContent=o.code;
  const[b1,b2]=d.querySelectorAll("button");b1.onclick=()=>copy(o.code);b2.onclick=()=>share(o.code);return d;
}
let offset=0,q="";
async function load(reset){
  if(reset){offset=0;$("#list").innerHTML=""}
  try{
    const rows=await rpc("good_list",{p_limit:50,p_offset:offset,p_q:q});
    rows.forEach(o=>$("#list").appendChild(keyRow(o)));
    offset+=rows.length;$("#more").style.display=rows.length===50?"":"none";
  }catch(e){toast("تعذر تحميل الأكواد")}
}
let tm;$("#q").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{q=e.target.value.trim();load(true)},300)};
$("#more").onclick=()=>load(false);
// device id (for exchange only)
let dev;try{dev=localStorage.getItem("dev");if(!dev){dev=crypto.randomUUID();localStorage.setItem("dev",dev)}}catch(e){dev=String(Math.random())}
$("#swap").onclick=async()=>{
  const c=$("#mine").value.trim();
  if(!/^[A-Za-z0-9_-]{4,64}$/.test(c)){toast("الكود غير صالح (حروف وأرقام و - _ فقط)");return}
  $("#swap").disabled=true;
  try{
    const got=await rpc("good_exchange",{p_code:c,p_device:dev});
    $("#got").innerHTML="";
    if(got){$("#got").appendChild(keyRow({code:got,featured:false}))}else toast("تمت إضافة كودك ✓ — مفيش كود جديد متاح حالياً");
    $("#mine").value="";load(true);
  }catch(e){toast("حصل خطأ، حاول تاني")}
  $("#swap").disabled=false;
};
// theme
const root=document.documentElement;
try{const s=localStorage.getItem("th");if(s)root.dataset.theme=s}catch(e){}
$("#th").onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;root.dataset.theme=dark?"light":"dark";try{localStorage.setItem("th",root.dataset.theme)}catch(e){}};
// visitors: every visit counts, repeats included
rpc("good_visit").then(n=>$("#vc").textContent=Number(n).toLocaleString("ar-EG")).catch(()=>rpc("good_count").then(n=>$("#vc").textContent=Number(n).toLocaleString("ar-EG")).catch(()=>$("#vc").textContent="—"));
load(true);
</script>
</body>
</html>
